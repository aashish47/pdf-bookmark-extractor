[package]
name = "pdf-bookmark-extractor"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Split PDFs into files and folders using their bookmark hierarchy"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
lopdf = { version = "0.46", default-features = false }
